name: CI

on:
  push:
    branches: [main, revamp/v2]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check pypsa_bot/

      - name: Type check
        run: uv run mypy pypsa_bot/ --ignore-missing-imports
        continue-on-error: true

      - name: Verify imports
        run: |
          uv run python -c "from pypsa_bot.config import config; print('Config OK')"
          uv run python -c "from pypsa_bot.cli import main; print('CLI OK')"

      - name: Syntax check
        run: uv run python -m py_compile pypsa_bot/cli.py
