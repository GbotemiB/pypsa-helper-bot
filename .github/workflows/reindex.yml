name: Nightly Reindex

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC nightly
  workflow_dispatch:
    inputs:
      full:
        description: 'Run full reindex (not incremental)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run incremental ingestion
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            uv run pypsa-bot ingest
          else
            uv run pypsa-bot ingest --incremental
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
